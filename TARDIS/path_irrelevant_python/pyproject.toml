[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tardis-tau1"
version = "0.1.0"
description = "Reproducible tau=1 Total/Inter/Intra distribution analysis"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.scripts]
tardis-tau1 = "tardis_tau1.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tardis_tau1*"]
